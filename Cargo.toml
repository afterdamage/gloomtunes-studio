[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["Vasil Vasilev"]
repository = "https://github.com/afterdamage/gloomtunes-studio"

[workspace.dependencies]
gt-core = { path = "crates/gt-core" }
gt-dsp = { path = "crates/gt-dsp" }
gt-engine = { path = "crates/gt-engine" }
gt-export = { path = "crates/gt-export" }
gt-plugin-host = { path = "crates/gt-plugin-host" }
gt-project = { path = "crates/gt-project" }
gt-ui = { path = "crates/gt-ui" }

cpal = { version = "0.18", features = ["realtime"] }
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "glow", "wayland", "x11"] }
egui = "0.36"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
assert_no_alloc = "1.1"
rtrb = "0.4"
symphonia = { version = "0.6", features = ["mp3"] }
rubato = "5"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }
rfd = "0.17"
midir = "0.11"
midly = { version = "0.5", default-features = false, features = ["alloc", "std"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
insta = "1"
clack-host = "0.2"
clack-plugin = "0.2"
clack-extensions = "0.2"
x11rb = "0.13"
windows-sys = "0.61"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false }
objc2-foundation = { version = "0.3", default-features = false }
libc = "0.2"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
# Dependencies optimized even in debug builds, so audio and UI stay smooth while developing.
opt-level = 2

[profile.release]
debug = 1

[profile.dist]
# Shipped builds (installers, .deb, AppImage): no line tables (crash reports still name the
# functions), thin LTO and one codegen unit for a smaller, slightly faster binary.
inherits = "release"
debug = false
strip = "debuginfo"
lto = "thin"
codegen-units = 1
