# cargo-deny: license allow-list, banned sources and security advisories (ARCHITECTURE §10).
# Run with `cargo deny check`. CI fails on licenses, bans and sources; advisories are reported
# without failing the build, since a new advisory can appear at any time without a code change.

[graph]
# Every target we ship on; macOS-only crates are left out of the check.
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[licenses]
confidence-threshold = 0.9
# Everything here is compatible with GPL-3.0-or-later. MPL-2.0 is file-level copyleft
# (symphonia, audio_thread_priority) and is flagged in ARCHITECTURE §10.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    "0BSD",
    "MPL-2.0",
]

# egui's built-in fonts (Ubuntu Light, Hack, Noto Emoji) are data, not code, under font
# licenses; flagged in ARCHITECTURE §10.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[licenses.private]
# The workspace crates themselves are GPL-3.0-or-later and never published.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "warn"
